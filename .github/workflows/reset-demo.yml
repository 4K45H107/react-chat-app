name: Reset demo data

# The demo logins are public, so visitors change things. Every night this
# deletes the demo accounts and everything they created, then reseeds the
# original accounts and chat history (timestamps relative to now).
on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 03:00 in Dhaka
  workflow_dispatch:

concurrency:
  group: reset-demo
  cancel-in-progress: false

jobs:
  reset:
    name: Reseed demo accounts and chats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A service account limited to Auth, Firestore and Storage objects
      - name: Write credentials
        run: |
          umask 077
          printf '%s' "$DEMO_SEED_SERVICE_ACCOUNT" > "$RUNNER_TEMP/seed-key.json"
        env:
          DEMO_SEED_SERVICE_ACCOUNT: ${{ secrets.DEMO_SEED_SERVICE_ACCOUNT }}
      - run: npm run seed
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/seed-key.json
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/seed-key.json"
